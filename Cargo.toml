[package]
name = "omcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "omcp (openmcp) - a CLI acting as an MCP client"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.79"
clap = { version = "=4.5.4", features = ["derive"] }
dirs = "5.0"
reqwest = { version = "0.11.24", default-features = false, features = ["json", "rustls-tls"] }
rustyline = "13"
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
tiny_http = "0.12.0"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
